<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsLens · My workspace</title>
  <link rel="icon" href="/app/favicon.svg">
  <link rel="stylesheet" href="/desk/desk.css">
</head>
<body>
  <div class="shell">
    <nav class="rail">
      <img class="logo" src="/app/favicon.svg" alt="OpsLens">
      <button class="on" title="Tickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tickets</button>
      <div class="spacer"></div>
      <button id="logout" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Sign out</button>
    </nav>
    <header class="top">
      <span class="title">My workspace</span>
      <span id="mystatus"></span>
      <span class="grow"></span>
      <button class="btn small" id="breakbtn" hidden></button>
      <div class="who"><div class="avatar" id="avatar"></div><div class="hide-sm"><div id="myname" style="font-weight:600"></div><div class="muted" id="myteam" style="font-size:12px"></div></div></div>
    </header>
    <main class="main" style="display:flex;flex-direction:column">
      <div class="card now" id="now" hidden></div>
      <div class="split" style="flex:1;min-height:0;margin-top:16px;border-top:1px solid var(--line)">
        <div class="views" id="views"></div>
        <div class="list" id="content"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/desk/agent/agent.js"></script>
</body>
</html>

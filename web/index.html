<!doctype html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsLens</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="neon.css">
  <link rel="stylesheet" href="boxes.css">
  <link rel="stylesheet" href="refined.css">
  <script>
    try { if (JSON.parse(localStorage.getItem("opslens-theme")) === "light") document.documentElement.removeAttribute("data-theme"); }
    catch (error) {}
  </script>
  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="fixture-banner" class="fixture-banner" hidden>
    FIXTURE DATA. Numbers are invented. Not real results.
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 40 40" width="50" height="50" aria-hidden="true">
          <defs><linearGradient id="lens-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
          <circle cx="18" cy="18" r="13" fill="none" stroke="url(#lens-g)" stroke-width="3.2"/>
          <path d="M8 19h5l2.5-5 4 9 3-6h5" fill="none" stroke="url(#lens-g)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M28 28l7 7" stroke="url(#lens-g)" stroke-width="3.6" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-name">OpsLens <span class="brand-by">by SoyaChaap</span></div>
          <div class="brand-tag">Every ticket is a promise</div>
        </div>
      </div>
      <nav id="tab-nav" class="nav" aria-label="Dashboard sections"></nav>
      <a class="live-ticker" id="live-ticker" href="#overview/live" hidden aria-label="Live today: open Live now"></a>
      <div class="sidebar-foot">Team SoyaChaap · Deviathon 2.0</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="world-switch" role="group" aria-label="Which data to show">
          <button type="button" data-world="food">Food delivery <span>simulated</span></button>
          <button type="button" data-world="real">Real data <span>UCI or your CSV</span></button>
        </div>
        <div class="world-switch role-switch" id="role-switch" role="group" aria-label="Whose screen">
          <button type="button" data-role="lead">Admin</button>
          <button type="button" data-role="agent">Agent view</button>
        </div>
        <div id="data-source" class="status" hidden></div>
        <div class="topbar-actions">
          <button id="theme-button" class="btn theme-switch" type="button" aria-label="Switch between neon and light colours">
            <span class="swatch" aria-hidden="true"></span><span id="theme-label">Light</span>
          </button>
          <button id="plan-button" class="btn" type="button" aria-label="Your plan">
            Your plan <span id="plan-count" class="count">0</span>
          </button>
          <button id="story-button" class="btn btn-primary" type="button" aria-label="Story mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
            <span class="story-label">Story mode</span>
          </button>
        </div>
      </header>
      <main id="tab-panels" class="content">
        <div id="load-message" class="card">Loading results…</div>
      </main>
    </div>
  </div>

  <div id="evidence-popover" class="evidence-popover" role="dialog" aria-label="Evidence" hidden></div>

  <div id="ask-panel" class="ask-panel" role="dialog" aria-label="Ask OpsLens answer" hidden></div>

  <aside id="plan-panel" class="plan-panel" aria-label="Your plan" hidden></aside>

  <div id="story-card" class="story-card" role="dialog" aria-label="Story mode" hidden></div>
</body>
</html>

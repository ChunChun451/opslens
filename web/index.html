<!doctype html>
<!--
  OpsLens dashboard — the one page the judges see.

  Why it is built this way:
  - Plain HTML + vanilla JS + CSS, no build step, so the owner can read every line.
  - Everything is local (Chart.js is in web/vendor/, no web fonts), because the demo
    runs on a projector with Wi-Fi off.
  - This file is only the frame: side menu, top bar, empty content area. app.js loads the
    results JSON and fills each tab. Every number on screen comes from that JSON
    (CLAUDE.md rule 1.5).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsLens</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Design v2 skin (Claude 2): Inter, refined palette, motion, the Overview's live floor. -->
  <link rel="stylesheet" href="theme.css">
  <!-- Chart.js 4.5.0, downloaded once and kept in the repo (works offline). -->
  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Shown only when meta.fixture is true. Fixed to the top so it is on every screenshot. -->
  <div id="fixture-banner" class="fixture-banner" hidden>
    FIXTURE DATA — numbers are invented. Not real results.
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">OpsLens</div>
          <div class="brand-tag">Decision engine for support operations</div>
        </div>
      </div>
      <nav id="tab-nav" class="nav" aria-label="Dashboard sections"></nav>
      <!-- Today's live run, on every screen (web/js/liveticker.js); opens Overview -> Live now. -->
      <a class="live-ticker" id="live-ticker" href="#overview/live" hidden aria-label="Live today: open Live now"></a>
      <button type="button" class="intro-replay" id="intro-replay" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Replay the night
      </button>
      <div class="sidebar-foot">Team SoyaChaap · Deviathon 2.0</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <!-- Which data (Plan v3): the simulated food-delivery floor, or a real public service desk. -->
        <div class="world-switch" role="group" aria-label="Which data to show">
          <button type="button" data-world="food">Food delivery <span>simulated</span></button>
          <button type="button" data-world="real">IT service desk <span>real, public</span></button>
        </div>
        <div id="data-source" class="status"></div>
        <!-- Ask OpsLens (web/js/ask.js): plain-words questions, answered by the engine. -->
        <form id="ask-form" class="ask-form" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H9l-5 4z"/></svg>
          <input id="ask-input" type="text" placeholder="Ask OpsLens… e.g. what if Team C loses 2 agents on Saturday?"
                 aria-label="Ask OpsLens a question" maxlength="300">
          <kbd>/</kbd>
        </form>
        <div class="topbar-actions">
          <button id="plan-button" class="btn" type="button" aria-label="Your plan">
            Your plan <span id="plan-count" class="count">0</span>
          </button>
          <button id="story-button" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
            Story mode
          </button>
        </div>
      </header>
      <main id="tab-panels" class="content">
        <div id="load-message" class="card">Loading results…</div>
      </main>
    </div>
  </div>

  <!-- Click-to-evidence popover. evidence.js fills and positions it. -->
  <div id="evidence-popover" class="evidence-popover" role="dialog" aria-label="Evidence" hidden></div>

  <!-- Cold open: one Saturday night on two floors (web/js/intro.js). -->
  <div id="intro" class="intro" role="dialog" aria-label="Introduction: one Saturday night" hidden></div>

  <!-- Ask OpsLens answer panel. ask.js fills it. -->
  <div id="ask-panel" class="ask-panel" role="dialog" aria-label="Ask OpsLens answer" hidden></div>

  <!-- Your plan: accepted / overridden recommendations and their impact (web/js/plan.js). -->
  <aside id="plan-panel" class="plan-panel" aria-label="Your plan" hidden></aside>

  <!-- Story mode card. story.js fills it. -->
  <div id="story-card" class="story-card" role="dialog" aria-label="Story mode" hidden></div>
</body>
</html>

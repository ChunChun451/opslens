# LLM providers (CLAUDE.md section 3).
# All use the OpenAI-compatible chat API, so one client works for all of them.
# Free-tier limits change without notice. The numbers below are deliberately BELOW the
# published free limits, so we never hit a 429 in the middle of a run.
# Verified on 15 Oct 2026 with `make ping`: gemini-3.1-flash-lite OK (1.3 s); on Groq,
# llama-3.1-8b-instant no longer exists, gpt-oss-20b had used its 200k tokens/day (the
# organisation's quota is shared with other projects), qwen/qwen3.8-27b OK (0.2 s) and
# openai/gpt-oss-120b OK (0.8 s). Each Groq model has its own daily token budget.

main: gemini
fallback: groq

providers:
  gemini:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 10     # free tier reported at 15 RPM
    requests_per_day: 400       # free tier reported at 500–1,000 RPD
    timeout_s: 60
    extra_params: {}

  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b       # alternative if its quota runs out: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    # Free tier for this model allows only 1,000 OUTPUT tokens per minute (seen on 15 Oct).
    # One 40-ticket batch is ~800 output tokens, so we pace ourselves to 1 request/minute.
    requests_per_minute: 1
    requests_per_day: 800       # free tier reported at 1,000 RPD
    timeout_s: 60
    extra_params:
      max_tokens: 900           # a request expecting > 1,000 output tokens is refused outright

  # The daily brief (opslens/brief.py) is written ONCE per `make eval` and stored in results.json,
  # so it can use a stronger, slower model: Flash-Lite wrote "2.2% of tickets occurred with
  # OpsLens" (17 Oct). The demo never calls it live.
  gemini_brief:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 5
    requests_per_day: 50
    timeout_s: 90
    extra_params: {}

  # Ask OpsLens (opslens/ask.py) routes ONE question per request with a ~60-token reply, so
  # it can ask more often than the batch classifier above without nearing 1,000 output
  # tokens/minute. Separate entry = separate pacing counter. Groq answered in 0.2 s on
  # 17 Oct; Gemini took 16 s, too slow for a live demo, so Groq goes first for routing.
  groq_route:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    requests_per_minute: 10
    requests_per_day: 300
    timeout_s: 20
    extra_params:
      max_tokens: 200

  mock:
    kind: mock
    model: mock-1
    requests_per_minute: 100000
    requests_per_day: 100000000

# Where the cache and the usage counters live (SQLite, git-ignored).
cache_db: cache/llm.sqlite

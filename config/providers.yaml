main: ollama
fallback: gemini

providers:
  ollama:
    kind: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen2.5:3b
    api_key_env: OLLAMA_API_KEY
    requests_per_minute: 600
    requests_per_day: 1000000
    timeout_s: 90
    extra_params:
      max_tokens: 2048

  ollama_route:
    kind: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen2.5:3b
    api_key_env: OLLAMA_API_KEY
    requests_per_minute: 600
    requests_per_day: 1000000
    timeout_s: 30
    extra_params:
      max_tokens: 200

  gemini:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 10
    requests_per_day: 400
    timeout_s: 60
    extra_params: {}

  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    requests_per_minute: 1
    requests_per_day: 800
    timeout_s: 60
    extra_params:
      max_tokens: 900

  gemini_brief:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    requests_per_minute: 5
    requests_per_day: 50
    timeout_s: 90
    extra_params: {}

  groq_route:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    requests_per_minute: 10
    requests_per_day: 300
    timeout_s: 20
    extra_params:
      max_tokens: 200

  mock:
    kind: mock
    model: mock-1
    requests_per_minute: 100000
    requests_per_day: 100000000

cache_db: cache/llm.sqlite

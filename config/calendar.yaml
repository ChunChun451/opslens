# The business calendar. The engine may read this file (unlike generator.yaml).
start_date: "2026-08-31"   # day 1 = Monday 31 Aug 2026
days: 56                   # 8 weeks
splits:                    # train 1-35, validation 36-42 (all tuning), test 43-56 (report only)
  train_last_day: 35
  validation_last_day: 42
  test_last_day: 56
known_events:              # marketing announces these in advance, so forecasts may use them
  - {day: 25, name: "Mega sale"}
  - {day: 50, name: "Festive sale"}

# The support floor: 40 agents in 4 teams. Every agent is listed, so a judge can see exactly
# who works when. All names are fictional.
#
# start    = shift start hour (shifts last `shift_hours`; a 22:00 start ends 07:00 next day)
# days_off = weekly days off (0 = Mon ... 6 = Sun). A night shift belongs to the day it starts.
# langs    = languages the agent can serve (en, hi, other)
# extra_skills = categories the agent is trained for ON TOP of the team's categories.
#          Status-quo agents work their team's queue first and help with extra skills only
#          when their own queue is empty. A ticket outside an agent's skills can still be
#          handled, but 1.6x slower (generator.yaml: skill_mismatch_factor) and with more reopens.
#          "all" = trained for every category.
#
# How the roster was made: start hours and days off were chosen with a small search that
# keeps each team's load (rho) as flat as possible across the 168 hours of the week —
# a reasonable status quo, not a strawman. Then two problems were planted on purpose:
#
# Planted problem 1 (skill gap): only 3 agents on the whole floor have Hindi + refund/payment
#   skills (Kavita B01, Arjun B02, Pooja B05), none at night. Hindi payment and refund tickets
#   therefore wait much longer than English ones.
#   (Night agents A09 and D11 speak Hindi but are not trained on refunds/payments.)
# Planted problem 2 (capacity): two of Team C's evening agents (C05, C07) are off every
#   Saturday and Sunday, while weekend-dinner volume of missing/wrong items is 1.35x.
#   Team D has 3 evening agents cross-trained on missing/wrong items (D06, D07, D09) —
#   the staffing fix OpsLens should find.

shift_hours: 9
max_concurrent: 1

teams:
  A: {name: "Live orders", skills: [late_delivery]}
  B: {name: "Payments & refunds", skills: [refund, payment_failure]}
  C: {name: "Order accuracy", skills: [missing_item, wrong_item]}
  D: {name: "Account, app & partners", skills: [account, app_bug, restaurant_partner]}

